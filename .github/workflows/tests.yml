name: Tests

# Le dépôt ne comportait aucun workflow : les fichiers de tests présents dans
# tests/ n'étaient jamais exécutés automatiquement. La console d'orchestration
# pilote le provisioning de tous les établissements — une régression y touche
# l'ensemble du parc, pas un seul hôtel.
#
# Ce workflow n'est rattaché à aucune publication d'image (le dépôt n'en
# produit pas). Il sert de garde-fou avant fusion.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pest:
    name: Suite Pest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      # La suite tourne sur SQLite en mémoire (voir phpunit.xml) : aucun
      # service de base de données n'est nécessaire.
      - name: Run tests
        run: php artisan test
