; ─────────────────────────────────────────────────────────────────────────────
; OPcache — réglage pour un code source monté depuis Windows
; ─────────────────────────────────────────────────────────────────────────────
;
; Le projet est monté en bind mount depuis C:\Users\user\Herd\wetchah_erp. Sur
; ce pont Windows↔Linux, un simple stat() coûte ~4,3 ms contre ~0,005 ms sur le
; disque du conteneur, soit ~870× plus lent.
;
; Or, avec validate_timestamps activé, OPcache revérifie la date de modification
; de CHAQUE fichier déjà compilé. Avec ~950 scripts en cache, cela représentait
; ~4,1 s de stat() par requête — ce qui correspondait exactement au temps de
; chargement mesuré sur /login. Le coût n'était pas la compilation (99,8 % de
; succès de cache) mais la validation.
;
; On désactive donc la validation : une fois un fichier compilé, PHP ne retouche
; plus au disque.
;
; CONTREPARTIE : aucune modification n'est prise en compte automatiquement, ni
; le code PHP, ni les vues Blade. Les vues compilées sont réécrites au même
; chemin, donc OPcache continue de servir l'ancien opcode (vérifié : un fichier
; modifié renvoyait toujours son contenu précédent). `view:clear` seul ne suffit
; donc pas — il faut recharger PHP-FPM :
;
;     docker exec wetchah_erp-app supervisorctl restart php-fpm
;
; Le script dev-refresh.ps1 à la racine du projet enchaîne le vidage des caches,
; le rechargement et le préchauffage.

opcache.validate_timestamps=0
opcache.revalidate_freq=0

; Marge confortable : ~10 300 fichiers PHP dans vendor/ plus le code applicatif.
opcache.max_accelerated_files=20000
opcache.memory_consumption=256
opcache.interned_strings_buffer=16

; Laravel s'appuie sur les attributs PHP lus par réflexion : les commentaires
; doivent être conservés dans l'opcode.
opcache.save_comments=1
